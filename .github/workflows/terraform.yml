name: 'Terraform Multi-Env CI/CD'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read      # Required to checkout code
  pull-requests: write # Required to post plan comments
  issues: write        # Backup for commenting

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    
    # Map the branch to the correct folder
    outputs:
      env_path: ${{ steps.set-env.outputs.path }}
      target_env: ${{ steps.set-env.outputs.name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set Environment Context
      id: set-env
      run: |
        if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "path=environments/prod" >> $GITHUB_OUTPUT
          echo "name=production" >> $GITHUB_OUTPUT
        else
          echo "path=environments/dev" >> $GITHUB_OUTPUT
          echo "name=development" >> $GITHUB_OUTPUT
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      run: terraform init
      working-directory: ${{ steps.set-env.outputs.path }}

    - name: Terraform Format & Validate
      id: validate
      run: |
        terraform fmt -check
        terraform validate
      working-directory: ${{ steps.set-env.outputs.path }}

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color
      working-directory: ${{ steps.set-env.outputs.path }}
      continue-on-error: true

    - name: Update Pull Request Comment
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Environment: \`${{ steps.set-env.outputs.name }}\`
          #### Terraform Format and Validate 🖌\`${{ steps.validate.outcome }}\`
          #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

          <details><summary>Show Plan Details</summary>

          \`\`\`\n
          ${process.env.PLAN}
          \`\`\`

          </details>

          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    # Automatic Apply for Develop branch (Dev Environment)
    - name: Terraform Apply (Dev)
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      run: terraform apply -auto-approve
      working-directory: ${{ steps.set-env.outputs.path }}

  # Separate Job for Production to enable Approval Gates
  deploy-prod:
    name: 'Deploy to Production'
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # This triggers the "Required Reviewers" in GitHub Settings
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      run: terraform init
      working-directory: environments/prod

    - name: Terraform Apply (Prod)
      run: terraform apply -auto-approve
      working-directory: environments/prod